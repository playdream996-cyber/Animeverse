name: animeverse
description: Original interactive anime mobile frontend prototype.
publish_to: none
version: 0.3.0+4
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/lora.ttf
